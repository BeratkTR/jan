name: Build Jan ARM64 Linux

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      JAN_ENGINE_VARIANT: cpu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libssl-dev build-essential curl wget file cmake ninja-build pkg-config

      - name: Build Engine and Frontend
        run: |
          yarn install
          yarn build:tauri:plugin:api
          yarn build:core
          yarn build:extensions

      - name: Bundle Tauri DEB Only
        run: yarn tauri build --bundles deb

      - name: Upload ARM64 DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jan-linux-arm64-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
