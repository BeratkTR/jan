name: Build Jan ARM64 Linux

on:
  workflow_dispatch:
    inputs:
      engine_variant:
        description: 'llama.cpp engine backend variant'
        required: false
        default: 'cpu'
        type: choice
        options:
          - cpu
          - vulkan
      release_tag:
        description: 'Optional GitHub Release tag (default: v<version>-arm64)'
        required: false
        default: ''
        type: string

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      JAN_ENGINE_VARIANT: ${{ inputs.engine_variant || 'cpu' }}
      CCACHE_MAXSIZE: 2G
      CCACHE_NOHASHDIR: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            cmake \
            curl \
            desktop-file-utils \
            file \
            g++-14 \
            gcc-14 \
            libatk1.0-dev \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            ninja-build \
            patchelf \
            pkg-config \
            wget \
            xdg-utils

      - name: Install Vulkan Build Dependencies
        if: contains(inputs.engine_variant, 'vulkan')
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev spirv-headers

      - name: Configure ccache
        run: echo "CCACHE_DIR=${HOME}/.ccache" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-arm64-${{ env.JAN_ENGINE_VARIANT }}-${{ hashFiles('src-tauri/plugins/tauri-plugin-llamacpp/build.rs') }}
          restore-keys: ccache-linux-arm64-${{ env.JAN_ENGINE_VARIANT }}-

      - name: Install Dependencies and Build Core & Extensions
        run: |
          chmod +x src-tauri/build-utils/*
          yarn install
          yarn build:tauri:plugin:api
          yarn build:core
          yarn build:extensions

      - name: Build llama.cpp Engine (ARM64)
        env:
          # Ubuntu 24.04 ships GCC 13 by default, which cannot compile llama.cpp's
          # ARMv9.2 SME CPU variants (GGML_CPU_ALL_VARIANTS=ON). Match upstream llama.cpp CI.
          CC: gcc-14
          CXX: g++-14
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: gcc-14
        run: |
          ccache -z
          make build-engine

      - name: Prepare Icons, Resources, and Binaries (uv, bun)
        run: |
          yarn build:icon
          yarn copy:assets:tauri
          yarn download:bin

      - name: Verify Bundled Resources Before Tauri Build
        run: |
          set -euo pipefail
          for f in \
            src-tauri/icons/32x32.png \
            src-tauri/icons/128x128.png \
            src-tauri/icons/128x128@2x.png \
            src-tauri/icons-macos/icon.icns \
            src-tauri/icons-windows/icon.ico \
            src-tauri/resources/LICENSE \
            src-tauri/resources/bin/jan-llama-worker \
            src-tauri/resources/bin/uv-aarch64-unknown-linux-gnu \
            src-tauri/resources/bin/bun
          do
            if [ ! -f "$f" ]; then
              echo "Missing required bundle asset: $f" >&2
              exit 1
            fi
          done
          ls -la src-tauri/resources/bin/lib*.so*

      - name: Bundle Tauri DEB (ARM64)
        run: yarn tauri build --bundles deb

      - name: Report ccache statistics
        if: success() || failure()
        run: ccache -s || true

      - name: Upload Engine Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-build-log-linux-arm64
          path: src-tauri/target/engine-build.log
          if-no-files-found: ignore

      - name: Upload ARM64 DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jan-linux-arm64-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Publish ARM64 DEB to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")
          if [ -n "$RELEASE_TAG_INPUT" ]; then
            TAG="$RELEASE_TAG_INPUT"
          elif [ "$JAN_ENGINE_VARIANT" = "cpu" ]; then
            TAG="v${VERSION}-arm64"
          else
            TAG="v${VERSION}-arm64-${JAN_ENGINE_VARIANT}"
          fi

          DEB_FILE=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          DEB_NAME=$(basename "$DEB_FILE")

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB_FILE" --clobber
          else
            gh release create "$TAG" "$DEB_FILE" \
              --title "Jan v${VERSION} (Linux ARM64 - ${JAN_ENGINE_VARIANT})" \
              --notes "Automated Linux ARM64 (.deb) build (engine variant: \`${JAN_ENGINE_VARIANT}\`)."
          fi

          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${DEB_NAME}"
          echo "Direct download URL: ${URL}"
          echo "### ARM64 DEB Release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Direct download: ${URL}" >> "$GITHUB_STEP_SUMMARY"
